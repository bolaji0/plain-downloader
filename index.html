<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plain — video downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171C;
    --panel: #1A1E26;
    --panel-raised: #20242E;
    --border: #2A2F3A;
    --text: #ECEDF0;
    --muted: #8B909C;
    --accent: #E8A33D;
    --accent-dim: #B97F2B;
    --error: #E5674A;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    padding-top: max(32px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }

  .stage {
    width: 100%;
    max-width: 460px;
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .mark svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  .mark h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .tagline {
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 24px;
    line-height: 1.5;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    position: relative;
    overflow: hidden;
  }

  .progress-rail {
    position: absolute;
    top: 0;
    left: 0;
    height: 2px;
    width: 0%;
    background: var(--accent);
    transition: width 0.4s ease;
  }
  .progress-rail.active {
    animation: sweep 1.1s ease-in-out infinite;
  }
  @keyframes sweep {
    0% { width: 0%; left: 0; }
    50% { width: 55%; left: 20%; }
    100% { width: 0%; left: 100%; }
  }

  .input-row {
    display: flex;
    gap: 6px;
    padding: 8px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.95rem;
  }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .btn-icon {
    background: var(--accent);
    color: #1A1400;
    border: none;
    border-radius: 7px;
    width: 44px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-icon:hover:not(:disabled) { background: #f0ae4e; }
  .btn-icon:disabled { opacity: 0.5; cursor: not-allowed; }

  .result {
    padding: 4px 12px 14px;
  }

  .video-title {
    font-size: 0.94rem;
    font-weight: 500;
    margin: 6px 0 14px;
    line-height: 1.4;
    word-break: break-word;
  }

  .quality-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }

  .pill {
    font-family: var(--mono);
    font-size: 0.82rem;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .pill:hover { border-color: var(--accent-dim); }
  .pill.active {
    background: rgba(232, 163, 61, 0.12);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pill .meta { color: var(--muted); font-size: 0.76rem; }
  .pill.active .meta { color: var(--accent-dim); }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #1A1400;
    border: none;
    border-radius: 7px;
    padding: 12px 14px;
    font-family: var(--sans);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:hover:not(:disabled) { background: #f0ae4e; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    min-height: 16px;
    margin: 10px 4px 2px;
  }
  .status.error { color: var(--error); }

  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.6;
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .progress-rail.active { animation: none; width: 40%; }
  }
</style>
</head>
<body>

<main class="stage">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v12m0 0l-5-5m5 5l5-5" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Plain</h1>
  </div>
  <p class="tagline">Paste a link, pick a quality, get the file. Nothing is saved.</p>

  <div class="panel">
    <div class="progress-rail" id="progressRail"></div>

    <div class="input-row">
      <input type="text" id="url" placeholder="Paste a video URL" autocomplete="off">
      <button id="fetchBtn" class="btn-icon" aria-label="Fetch formats">↵</button>
    </div>

    <div class="result" id="result" hidden>
      <p class="video-title" id="videoTitle"></p>
      <div class="quality-picker" id="qualityPicker"></div>
      <button id="downloadBtn" class="btn-primary">Download</button>
    </div>

    <p class="status" id="status" role="status"></p>
  </div>

  <footer>
    Built on <a href="https://github.com/yt-dlp/yt-dlp" target="_blank" rel="noopener">yt-dlp</a>
    — open source, Unlicense. Credit to its maintainers for the extraction engine this runs on.
  </footer>
</main>

<script>
  // Replace with your deployed backend URL (e.g. your Render service URL)
  const API_BASE = "https://your-backend.onrender.com";

  const urlInput = document.getElementById("url");
  const fetchBtn = document.getElementById("fetchBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const resultEl = document.getElementById("result");
  const qualityPicker = document.getElementById("qualityPicker");
  const statusEl = document.getElementById("status");
  const titleEl = document.getElementById("videoTitle");
  const progressRail = document.getElementById("progressRail");

  let selectedFormat = null;

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (isError ? " error" : "");
  }

  function setBusy(isBusy) {
    progressRail.classList.toggle("active", isBusy);
    fetchBtn.disabled = isBusy;
  }

  function formatSize(bytes) {
    if (!bytes) return "";
    const mb = bytes / (1024 * 1024);
    return mb >= 1 ? `${mb.toFixed(1)} MB` : `${(bytes / 1024).toFixed(0)} KB`;
  }

  // Collapse yt-dlp's raw format list into clean quality tiers (1080p, 720p, ..., Audio only),
  // keeping the largest/best file per tier.
  function buildQualityTiers(formats) {
    const groups = {};
    formats.forEach((f) => {
      let label;
      if (f.resolution === "audio only") {
        label = "Audio only";
      } else {
        const match = /x(\d+)$/.exec(f.resolution || "");
        if (!match) return;
        label = `${match[1]}p`;
      }
      const existing = groups[label];
      if (!existing || (f.filesize || 0) > (existing.filesize || 0)) {
        groups[label] = f;
      }
    });

    return Object.entries(groups)
      .sort(([a], [b]) => {
        if (a === "Audio only") return 1;
        if (b === "Audio only") return -1;
        return parseInt(b, 10) - parseInt(a, 10);
      })
      .map(([label, f]) => ({ label, ...f }));
  }

  function renderQualityPicker(tiers) {
    qualityPicker.innerHTML = "";
    tiers.forEach((tier, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pill" + (i === 0 ? " active" : "");
      const size = formatSize(tier.filesize);
      btn.innerHTML = `${tier.label}${size ? ` <span class="meta">${size}</span>` : ""}`;
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pill").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        selectedFormat = tier.format_id;
      });
      qualityPicker.appendChild(btn);
    });
    if (tiers.length) selectedFormat = tiers[0].format_id;
  }

  fetchBtn.addEventListener("click", async () => {
    const url = urlInput.value.trim();
    if (!url) {
      setStatus("Paste a URL first.", true);
      return;
    }

    resultEl.hidden = true;
    setBusy(true);
    setStatus("Reading formats…");

    try {
      const res = await fetch(`${API_BASE}/formats?url=${encodeURIComponent(url)}`);
      const data = await res.json();

      if (!res.ok) {
        setStatus(data.detail || "Something went wrong.", true);
        return;
      }

      const tiers = buildQualityTiers(data.formats);
      if (!tiers.length) {
        setStatus("No usable formats found for that link.", true);
        return;
      }

      titleEl.textContent = data.title;
      renderQualityPicker(tiers);
      resultEl.hidden = false;
      setStatus("Ready.");
    } catch (err) {
      setStatus("Couldn't reach the server. Is the backend running?", true);
    } finally {
      setBusy(false);
    }
  });

  downloadBtn.addEventListener("click", () => {
    const url = urlInput.value.trim();
    if (!url || !selectedFormat) return;

    setStatus("Starting download…");
    setBusy(true);
    const downloadUrl = `${API_BASE}/download?url=${encodeURIComponent(url)}&format_id=${encodeURIComponent(selectedFormat)}`;
    window.location.href = downloadUrl;
    setTimeout(() => setBusy(false), 2500);
  });

  urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") fetchBtn.click();
  });
</script>

</body>
</html>
